<!DOCTYPE html>
<html>
<head>
    <title>Lista de Alunos</title>
</head>
<body>
    <h1>Alunos Cadastrados</h1>
    <ul>
        {% for aluno in alunos %}
            <li>{{ aluno.nome }} {{ aluno.sobrenome }} - {{ aluno.email }}</li>
        {% empty %}
            <li>Nenhum aluno cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
